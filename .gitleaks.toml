# Repo-local gitleaks config.
# Starts from the default rules and allows bare 20-byte EVM addresses
# (0x + exactly 40 hex characters). Those are public contract addresses (tokens, vaults,
# the protocols this repo reads), and the generic-api-key rule mistakes them for secrets
# when they sit next to a key called "token" or "key". A private key is 32 bytes (64 hex
# characters) and is NOT covered by the address exception. The only allowed private
# key below is Anvil's publicly known default dev account #0, used for local fork tests.
title = "pharos-agent-kit gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "public EVM addresses and Anvil's public default dev account #0"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  '''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
]
