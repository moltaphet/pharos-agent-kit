<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharos Agent Kit</title>
  <meta name="description" content="Working agents for the Pharos Season of AI tasks, built on Chain MCP and Developer Docs MCP. Try each one live.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Cpath d='M16 6v14M10 26h12M13 20h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <button id="menu" class="icon-btn" aria-label="Toggle task menu" aria-expanded="false">☰</button>
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Pharos Agent Kit</a>
    <span class="top-note">Season of AI build hub</span>
    <a class="top-link" id="repo-link" href="#" target="_blank" rel="noopener">GitHub ↗</a>
  </header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Tasks">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button data-f="all" class="on">All</button><button data-f="built">Built</button><button data-f="planned">Planned</button>
      </div>
      <input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks" autocomplete="off">
      <div id="nav"></div>
    </nav>
    <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
