<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharos Agent Kit</title>
  <meta name="description" content="Working agents for Pharos built on Chain MCP and Developer Docs MCP. Run each one, read its log call by call, and verify the result independently.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8cff'/%3E%3Cpath d='M16 6v14M10 26h12M13 20h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <button id="menu" class="icon-btn" aria-label="Toggle task menu" aria-expanded="false" aria-controls="side">☰</button>
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Pharos Agent Kit</a>
    <div id="health" class="health" role="status" aria-label="Live status of the Pharos services this site uses"></div>
    <nav class="top-links" aria-label="Site">
      <a href="#/about">How it was built</a>
      <a id="repo-link" href="#" target="_blank" rel="noopener">GitHub ↗</a>
      <button id="theme" class="icon-btn" aria-label="Switch theme"></button>
    </nav>
  </header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Tasks">
      <div class="nav-top">
        <a href="#/">Overview</a>
        <a href="#/about">How it was built</a>
      </div>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-f="all" class="on">All</button><button type="button" data-f="live">Live</button><button type="button" data-f="planned">Planned</button>
      </div>
      <label class="sr-only" for="search">Search tasks</label>
      <input id="search" type="search" placeholder="Search tasks  ( / )" autocomplete="off">
      <div id="nav"></div>
    </nav>
    <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
