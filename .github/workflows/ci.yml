name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Some existing tests compile contracts with forge and cross-check selectors with cast.
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm test

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --root contracts --match-contract TreasuryTest -vv

  treasury-copilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: treasury-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: treasury-copilot/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm test
      - run: npm run test:contracts
